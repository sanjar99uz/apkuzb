
name: Promo Bot Cron

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promo-bot-cron
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository kodini olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Brauzer va bog'liqliklarni o'rnatish
        run: |
          npm init -y
          npm install puppeteer
          mkdir -p screenshots

      - name: Botni ishga tushirish
        id: runbot
        shell: bash
        run: |
          set +e
          node bot.js 2>&1 | tee screenshots/bot.log
          status=${PIPESTATUS[0]}
          echo "BOT_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Skrinshotlarni Artifact sifatida yuklash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promo-bot-results-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Bot natijasini tekshirish
        if: always()
        shell: bash
        run: |
          if [ "${BOT_EXIT_CODE:-1}" != "0" ]; then
            echo "Bot xato bilan tugadi. Logni tekshiring."
            exit 1
          fi
          
