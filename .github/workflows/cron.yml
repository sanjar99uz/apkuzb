
name: Promo Bot Cron

on:
  workflow_dispatch:

  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: promo-bot-cron
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository kodini olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Papkalarni tayyorlash
        run: mkdir -p screenshots

      - name: Puppeteer va bog'liqliklarni o'rnatish
        run: |
          npm init -y
          npm install puppeteer

      - name: Botni ishga tushirish
        id: runbot
        shell: bash
        run: |
          mkdir -p screenshots

          set +e
          node bot.js 2>&1 | tee screenshots/bot.log

          STATUS=${PIPESTATUS[0]}

          echo "BOT_EXIT_CODE=$STATUS" >> "$GITHUB_ENV"
          echo "Bot exit code: $STATUS"

          exit 0

      - name: Natijalarni tekshirish
        if: always()
        shell: bash
        run: |
          echo "Bot exit code: ${BOT_EXIT_CODE:-not-set}"
          echo ""
          echo "Yaratilgan fayllar:"
          find screenshots -maxdepth 2 -type f -print || true

      - name: Skrinshot va loglarni Artifact sifatida yuklash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promo-bot-results-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7
          
