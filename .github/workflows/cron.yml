name: Run Click Bot & Screenshots

on:
  schedule:
    # Har soatda bir marta avtomatik ishga tushadi
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub Actions bo'limidan qo'lda test qilib ko'rish uchun

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repository kodini yuklab olish
        uses: actions/checkout@v4

      - name: Node.js muhitini o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kutubxonalarni o'rnatish
        run: npm install

      - name: Botni ishga tushirish
        run: npm start

      - name: Skrinshotlarni GitHub Artifacts sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: |
            1_before.png
            2_middle.png
            3_after.png
          if-no-files-found: ignore
          
