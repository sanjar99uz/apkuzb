
name: Promo Bot Cron

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promo-bot-cron
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository kodini olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bog'liqliklarni o'rnatish
        run: |
          npm init -y
          npm install puppeteer

      - name: Botni ishga tushirish
        run: node bot.js

      - name: Skrinshotlarni Artifact sifatida saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promo-bot-screenshots-${{ github.run_number }}
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
          
