name: Run Click Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: # Qo'lda ishga tushirish uchun

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'ni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js muhitini o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kutubxonalarni o'rnatish
        run: npm install

      - name: Botni ishga tushirish
        run: npm start

      - name: Skrinshotlarni yuklab olish uchun saqlash (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: *.png
          
